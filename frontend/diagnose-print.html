<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 诊断报告</title>
  <style>
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC",
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 20px 22px; font-size: 14px; line-height: 1.72; }
    .wrap { max-width: 820px; margin: 0 auto; }
    .cover {
      background: #fff;
      color: #111;
      border: 1px solid #d9d9d9;
      border-radius: 12px;
      padding: 24px 26px;
      margin-bottom: 16px;
    }
    .kicker {
      font-size: 11px;
      color: #666;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 10px 0 14px;
      line-height: 1.45;
      color: #111;
    }
    .meta {
      font-size: 12px;
      color: #555;
      line-height: 1.8;
      border-top: 1px solid #e5e5e5;
      padding-top: 12px;
    }
    .pill {
      display: inline-block;
      border: 1px solid #cfd8ff;
      border-radius: 999px;
      padding: 4px 10px;
      margin-top: 12px;
      font-size: 11px;
      color: #315efb;
      background: #f5f8ff;
    }
    .card {
      background: #fff;
      color: #111;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 24px 26px;
      margin-bottom: 16px;
    }
    .doc-prose, .doc-prose * { color: #111 !important; font-family: inherit !important; }
    .doc-prose { font-size: 14px; line-height: 1.8; }
    .doc-prose h2 { font-size: 19px; font-weight: 700; margin: 24px 0 12px; }
    .doc-prose h2:first-child { margin-top: 0; }
    .doc-prose h3 { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }
    .doc-prose p { margin: 10px 0; }
    .doc-prose strong { font-weight: 700; }
    .doc-prose ul, .doc-prose ol { margin: 8px 0; padding-left: 22px; }
    .doc-prose li { margin: 6px 0; }
    .doc-prose ul { list-style: disc; }
    .doc-prose ol { list-style: decimal; }
    .doc-prose ul li::before { content: none !important; }
    .doc-prose blockquote {
      margin: 14px 0;
      padding: 10px 14px;
      border-left: 3px solid #315efb;
      background: #f7f9fc;
    }
    .doc-prose code {
      font-family: "SF Mono", "Menlo", "Consolas", monospace !important;
      font-size: 12px;
      background: #f2f2f2;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .doc-prose hr { border: none; border-top: 1px solid #e5e5e5; margin: 18px 0; }
    .foot { text-align: center; color: #777; font-size: 11px; margin-top: 20px; }
    .error {
      max-width: 720px;
      margin: 40px auto;
      padding: 18px 20px;
      border: 1px solid #ffd1d1;
      border-radius: 12px;
      background: #fff5f5;
      color: #9f1d1d;
      line-height: 1.7;
    }
    @page { size: A4; margin: 10mm; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function showError(msg) {
        document.getElementById("app").innerHTML =
          '<div class="error">打印页生成失败：' + esc(msg) + "</div>";
      }

      let payload = null;
      try {
        payload = JSON.parse(window.name || "{}");
      } catch (err) {
        showError("无法解析打印数据");
        return;
      }

      if (!payload || !payload.reportHtml) {
        showError("没有可打印的报告内容");
        return;
      }

      document.title = "AI 诊断报告 · " + (payload.title || "Session");
      const pillHtml = payload.updatesCount
        ? '<div class="pill">补充报告 ' + esc(payload.updatesCount) + "</div>"
        : "";
      const consultHtml = payload.consultHtml || "";

      document.getElementById("app").innerHTML = ''
        + '<div class="wrap">'
        + '  <div class="cover">'
        + '    <div class="kicker">AI Agent 行为诊断报告</div>'
        + '    <h1>' + esc(payload.title || "Session") + '</h1>'
        + '    <div class="meta">'
        + '      Session ID：' + esc(payload.sessionId || "-") + '<br>'
        + '      生成时间：' + esc(payload.generatedAt || "-") + '<br>'
        + '      分析模型：豆包 2.0 · 语义级复盘'
        + '    </div>'
        +       pillHtml
        + '  </div>'
        + '  <div class="card"><div class="doc-prose">' + payload.reportHtml + '</div></div>'
        +       consultHtml
        + '  <div class="foot">本报告由 AgentTrace · AI 一键诊断生成</div>'
        + '</div>';

      window.addEventListener("load", function () {
        setTimeout(function () {
          window.focus();
          window.print();
        }, 220);
      });

      window.addEventListener("afterprint", function () {
        setTimeout(function () { window.close(); }, 120);
      });
    })();
  </script>
</body>
</html>
